[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mars-nanopore"
# Single-sourced from mars/_version.py so the git tag, the distribution
# metadata and `mars --version` can never disagree.
dynamic = ["version"]
description = "MARS: RNA modification detection from Nanopore direct-RNA sequencing data"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "MARS Team"}
]
keywords = [
    "nanopore",
    "RNA modification",
    "m6A",
    "m5C",
    "epitranscriptomics",
    "bioinformatics",
    "sequencing",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
    "pysam>=0.19.0",
    "xgboost>=1.5.0",
    "biopython>=1.79",
    "tqdm>=4.60.0",
]

[project.optional-dependencies]
# Needed by `mars train` for metrics and the scatter/heatmap plots.
train = [
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "scikit-learn>=1.0.0",
]
# Note: `pip install mars-nanopore[gpu]` installs the default (usually CPU)
# torch wheel. For actual CUDA acceleration, use install.sh --gpu --cuda=<ver>
# or install torch manually from the right PyTorch wheel index.
gpu = [
    "torch>=1.10.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "build>=1.0.0",
    "twine>=4.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
]
all = [
    "mars-nanopore[train,gpu,dev]",
]

[project.scripts]
# Umbrella CLI: `mars run|predict|train|prepdata|list-models|doctor|version`
mars = "mars.cli:main"
# One console script per stage, so nothing has to be invoked as a file path.
mars-pipeline = "mars.pipeline:cli_main"
mars-predict = "mars.model.predict:cli_main"
mars-train = "mars.model.train:cli_main"
mars-doctor = "mars.doctor:main"
# Legacy script names kept as first-class commands for MARS 3.x users.
xgb_model_pred = "mars.model.predict:cli_main"
xgb_model = "mars.model.train:cli_main"
# Feature-extraction core.
nfl-py = "nfl_py.cli:main"

[project.urls]
Homepage = "https://github.com/niujiale/MARS"
Documentation = "https://github.com/niujiale/MARS#readme"
Repository = "https://github.com/niujiale/MARS"
Changelog = "https://github.com/niujiale/MARS/blob/main/CHANGELOG.md"
Releases = "https://github.com/niujiale/MARS/releases"
Issues = "https://github.com/niujiale/MARS/issues"

[tool.setuptools.dynamic]
version = {attr = "mars._version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["mars*", "nfl_py*"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
