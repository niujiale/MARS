# Conda environment for MARS 4.0.0
#
# Created by `bash install.sh`, which then runs `pip install -e .[train]` so the
# `mars`, `mars-predict`, `xgb_model_pred`, ... commands land on PATH.
#
# Lower bounds only: pinning exact builds here breaks on the many CUDA/glibc
# combinations MARS is run on. For a byte-reproducible environment, export a
# lock file after installing:  conda env export -n MARS > mars-4.0.0.lock.yml
name: MARS
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python>=3.9
  - numpy>=1.20.0
  - scipy>=1.7.0
  - pandas>=1.3.0
  - pysam>=0.19.0
  - xgboost>=1.5.0
  - biopython>=1.79
  - tqdm>=4.60.0
  # Required by `mars train` for metrics and the scatter/heatmap plots.
  - matplotlib-base>=3.4.0
  - seaborn>=0.11.0
  - scikit-learn>=1.0.0
  # Alignment and BAM handling, invoked as subprocesses by `mars run`.
  - minimap2
  - samtools
  - pip
  # PyTorch is installed separately via install.sh --gpu so the wheel matches
  # the server's CUDA version. Do not pin it here; the conda-forge pytorch
  # package is often out of sync with the NVIDIA CUDA you actually have.
