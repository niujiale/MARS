name: Release

# Publishing is driven entirely by the git tag, so a release can never be
# created from an unversioned working tree.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v4.0.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish ${{ github.ref_name }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # A tag that disagrees with mars/_version.py is the exact failure mode
      # that makes a "released" version unreproducible, so fail loudly here.
      - name: Check tag matches mars/_version.py
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          pkg=$(python -c "import re,pathlib; \
            print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', \
            pathlib.Path('mars/_version.py').read_text()).group(1))")
          echo "tag=$tag  mars/_version.py=$pkg"
          if [ "$tag" != "v$pkg" ]; then
            echo "::error::tag $tag does not match version $pkg in mars/_version.py"
            exit 1
          fi

      - name: Check the changelog documents this version
        run: |
          set -euo pipefail
          pkg=$(python -c "import re,pathlib; \
            print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', \
            pathlib.Path('mars/_version.py').read_text()).group(1))")
          grep -q "^## \[$pkg\]" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no '## [$pkg]' section"
            exit 1
          }

      - name: Install minimap2 and samtools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minimap2 samtools

      - name: Install and test
        run: |
          python -m pip install --upgrade pip build twine
          pip install -e '.[train,dev]'
          mars doctor
          pytest tests/ -v

      - name: Build distributions
        run: |
          python -m build
          twine check dist/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: MARS ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          body: |
            Formal release of MARS ${{ github.event.inputs.tag || github.ref_name }}.

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.event.inputs.tag || github.ref_name }}/CHANGELOG.md)
            for what changed.

            **Install this exact version**

            ```bash
            pip install "https://github.com/${{ github.repository }}/archive/refs/tags/${{ github.event.inputs.tag || github.ref_name }}.tar.gz"
            ```

            or, for the full tree with pretrained models and the bundled example:

            ```bash
            curl -L -o mars.tar.gz "https://github.com/${{ github.repository }}/archive/refs/tags/${{ github.event.inputs.tag || github.ref_name }}.tar.gz"
            tar xzf mars.tar.gz && cd MARS-*
            bash install.sh
            ```

            Verify with `mars --version` and `mars doctor`.
          files: |
            dist/*.tar.gz
            dist/*.whl
